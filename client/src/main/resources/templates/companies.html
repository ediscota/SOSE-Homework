<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Companies')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div class="page-header">
        <h2>Companies</h2>
        <a class="btn" th:href="@{/companies/new}">+ New Company</a>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Website</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="co : ${companies}">
                <td><code th:text="${co.id}">company-001</code></td>
                <td th:text="${co.name}">Name</td>
                <td>
                    <a th:if="${co.website != null and !#strings.isEmpty(co.website)}"
                       th:href="${co.website}" target="_blank" th:text="${co.website}">website</a>
                </td>
                <td class="table-actions">
                    <a class="btn btn-sm btn-secondary" th:href="@{/companies/__${co.id}__/edit}">Edit</a>
                    <form th:action="@{/companies/__${co.id}__/delete}" method="post" style="display:inline">
                        <button class="btn btn-sm btn-danger" type="submit"
                                onclick="return confirm('Delete this company?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
