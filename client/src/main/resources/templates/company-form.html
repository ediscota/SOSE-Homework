<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Company' : 'New Company')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2 th:text="${isEdit} ? 'Edit Company' : 'New Company'">Company Form</h2>
    <div class="card">
        <form th:action="${isEdit} ? '/companies/' + ${company.id} + '/edit' : '/companies/new'"
              method="post">

            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required
                       th:value="${company != null ? company.name : ''}"/>
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="text" id="website" name="website" placeholder="https://..."
                       th:value="${company != null ? company.website : ''}"/>
            </div>

            <div class="form-actions">
                <button class="btn" type="submit" th:text="${isEdit} ? 'Save Changes' : 'Create Company'">Submit</button>
                <a class="btn btn-secondary" th:href="@{/companies}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
