<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sectors')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div class="page-header">
        <h2>Sectors</h2>
        <a class="btn" th:href="@{/sectors/new}">+ New Sector</a>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Label</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="sec : ${sectors}">
                <td><code th:text="${sec.id}">sector-001</code></td>
                <td th:text="${sec.label}">Label</td>
                <td class="table-actions">
                    <a class="btn btn-sm btn-secondary" th:href="@{/sectors/__${sec.id}__/edit}">Edit</a>
                    <form th:action="@{/sectors/__${sec.id}__/delete}" method="post" style="display:inline">
                        <button class="btn btn-sm btn-danger" type="submit"
                                onclick="return confirm('Delete this sector?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
